name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish verified release
    needs: verify
    if: github.repository == 'AverageConsumer/kanto-gear'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kanto-gear-${{ github.sha }}
          path: dist
      - name: Verify downloaded files against the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/ci.py --verify-only --tag "$RELEASE_TAG"
      - name: Publish ZIP, verification report and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.verification.json dist/*.sha256 \
            --verify-tag --title "Kanto Gear ${RELEASE_TAG#v}" \
            --notes-file "release-notes/$RELEASE_TAG.md"
