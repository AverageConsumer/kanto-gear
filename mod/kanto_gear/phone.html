<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanto Gear · Wi-Fi Controller</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { --bg: #101e23; --panel: #1d3438; --ink: #edf6ee; --accent: #7bceb4;
    --edge: #518174; background: var(--bg); color: var(--ink); font: 16px system-ui, sans-serif;
    height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 8px; }
  body[data-theme="pokegear-light"] { --bg: #d1ead8; --panel: #f4f6e9; --ink: #203f36; --accent: #4c9b81; --edge: #557e6b; }
  body[data-theme="cgear-dark"] { --bg: #101720; --panel: #202d38; --ink: #edf6ff; --accent: #57c7eb; --edge: #42718c; }
  body[data-theme="cgear-light"] { --bg: #e9f2f6; --panel: #fff; --ink: #213d51; --accent: #138bb4; --edge: #7ca2b9; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  main { display: grid; place-items: center; min-height: 0; min-width: 0; }
  form { width: min(100%, 340px); text-align: center; }
  h1 { margin: 0 0 8px; font-size: 24px; } p { line-height: 1.5; }
  input, button, select { min-height: 44px; border: 2px solid var(--edge); border-radius: 8px;
    font: inherit; color: var(--ink); background: var(--panel); }
  button { cursor: pointer; font-weight: 650; padding: 8px 16px; }
  button:disabled { opacity: .4; cursor: default; }
  input { width: 100%; text-align: center; letter-spacing: 4px; }
  form label { display: block; margin-bottom: 8px; }
  form button { width: 100%; margin-top: 12px; }
  #controller { --button-scale: 1; width: 100%; height: 100%; min-height: 0; display: grid;
    grid-template-columns: clamp(140px, 20vw, 220px) minmax(0, 1fr) clamp(140px, 20vw, 220px);
    gap: 12px; background: var(--panel); border: 2px solid var(--edge); border-radius: 24px; padding: 12px; }
  #gear-slot { display: grid; place-items: center; min-width: 0; min-height: 0; }
  canvas { display: none; image-rendering: pixelated; touch-action: none; user-select: none; }
  .controls { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
  [data-button] { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    width: max(44px, calc(44px * var(--button-scale))); height: max(44px, calc(44px * var(--button-scale))); padding: 0;
    display: grid; place-items: center; }
  [data-button].held { background: var(--accent); color: var(--bg); }
  [data-shoulder] { width: calc(88px * var(--button-scale)); }
  #dpad { display: grid; grid-template-columns: repeat(3, max(44px, calc(44px * var(--button-scale)))); grid-template-rows: repeat(3, max(44px, calc(44px * var(--button-scale)))); }
  [data-button="up"] { grid-area: 1 / 2; } [data-button="left"] { grid-area: 2 / 1; }
  [data-button="right"] { grid-area: 2 / 3; } [data-button="down"] { grid-area: 3 / 2; }
  .actions { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .actions [data-button] { border-radius: 50%; width: max(44px, calc(52px * var(--button-scale))); height: max(44px, calc(52px * var(--button-scale))); }
  .system { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .system [data-button] { width: auto; padding: 0 8px; font-size: 12px; }
  #controller[data-layout="stacked"] { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  #controller[data-layout="stacked"] #gear-slot { grid-area: 1 / 1 / 2 / 3; }
  #controller[data-layout="stacked"] #left-controls { grid-area: 2 / 1; }
  #controller[data-layout="stacked"] #right-controls { grid-area: 2 / 2; }
  @media (max-aspect-ratio: 5/4) {
    #controller[data-layout="auto"] { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    #controller[data-layout="auto"] #gear-slot { grid-area: 1 / 1 / 2 / 3; }
    #controller[data-layout="auto"] #left-controls { grid-area: 2 / 1; }
    #controller[data-layout="auto"] #right-controls { grid-area: 2 / 2; }
  }
  #controller[data-controls="false"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  #controller[data-controls="false"] .controls { display: none; }
  #controller[data-controls="false"] #gear-slot { grid-area: 1 / 1; }
  dialog { width: min(92vw, 420px); max-height: 90dvh; overflow: auto; background: var(--panel); color: var(--ink); border: 2px solid var(--edge); border-radius: 16px; padding: 20px; }
  dialog::backdrop { background: #0009; }
  dialog label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0; }
  dialog input[type="checkbox"] { width: 24px; height: 24px; min-height: 24px; }
  dialog select { max-width: 60%; }
  .dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  footer { text-align: center; font-size: 12px; min-height: 16px; }
  [hidden] { display: none !important; }
</style>
<header><strong>Kanto Gear</strong><button id="settings-open" type="button">Settings</button></header>
<main>
  <form id="pair">
    <h1>Connect your Gear</h1>
    <p>Keep the game open on the same Wi-Fi.</p>
    <label for="pin">Pairing code shown in the game</label>
    <input id="pin" name="pin" inputmode="numeric" autocomplete="off" pattern="[0-9]{8}" maxlength="8" minlength="8" required aria-describedby="status">
    <button id="connect" type="submit">Connect</button>
  </form>
  <section id="controller" data-layout="auto" data-controls="true" aria-label="Wi-Fi controller" hidden>
    <div id="left-controls" class="controls">
      <button type="button" data-button="l" data-shoulder hidden disabled>L</button>
      <div id="dpad" aria-label="Directional pad">
        <button type="button" data-button="up" data-dpad aria-label="Up" disabled>▲</button>
        <button type="button" data-button="left" data-dpad aria-label="Left" disabled>◀</button>
        <button type="button" data-button="right" data-dpad aria-label="Right" disabled>▶</button>
        <button type="button" data-button="down" data-dpad aria-label="Down" disabled>▼</button>
      </div>
    </div>
    <div id="gear-slot"><canvas id="gear" aria-label="Kanto Gear touch display"></canvas></div>
    <div id="right-controls" class="controls">
      <button type="button" data-button="r" data-shoulder hidden disabled>R</button>
      <div class="actions"><button type="button" data-button="b" disabled>B</button><button type="button" data-button="a" disabled>A</button></div>
      <div class="system"><button type="button" data-button="select" disabled>Select</button><button type="button" data-button="start" disabled>Start</button></div>
    </div>
  </section>
</main>
<footer id="status" role="status" aria-live="polite">Waiting for pairing</footer>
<dialog id="settings" aria-labelledby="settings-title">
  <h1 id="settings-title">Browser settings</h1>
  <label>Show controller buttons <input id="setting-controls" type="checkbox" checked></label>
  <label>Layout <select id="setting-layout"><option value="auto">Automatic</option><option value="wide">Sides</option><option value="stacked">Below Gear</option></select></label>
  <label>Button size <select id="setting-size"><option value="0.8">Small</option><option value="1">Normal</option><option value="1.2">Large</option><option value="1.4">Extra large</option></select></label>
  <label>Theme <select id="setting-theme"><option value="pokegear-light">Pokégear · Light</option><option value="pokegear-dark">Pokégear · Dark</option><option value="cgear-light">C-Gear · Light</option><option value="cgear-dark">C-Gear · Dark</option></select></label>
  <p>Saved only in this browser. Game and Gear settings stay separate.</p>
  <div class="dialog-actions"><button id="fullscreen" type="button">Fullscreen</button><button id="disconnect" type="button">Disconnect</button><button id="settings-close" type="button">Done</button></div>
</dialog>
<script src="/phone.js" defer></script>
</html>
